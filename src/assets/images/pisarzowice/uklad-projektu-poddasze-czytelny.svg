<svg xmlns="http://www.w3.org/2000/svg" width="815" height="750" viewBox="270 245 815 750" role="img" aria-labelledby="title desc">
  <title id="title">Poddasze — schemat układu projektu</title>
  <desc id="desc">Trzy sypialnie, łazienka i hall ze schodami. Numery odpowiadają legendzie. Układ odwzorowany ze skanu projektu; wymiary dostępne w oryginalnym rzucie.</desc>
  <style>
    .wall{fill:none;stroke:#1a3b5d;stroke-width:12;stroke-linecap:butt;stroke-linejoin:miter}
    .outer{stroke-width:34}
    .opening{stroke:#fff;stroke-width:38}
    .detail{fill:none;stroke:#58718a;stroke-width:2.5}
    .window{fill:#fff;stroke:#58718a;stroke-width:2.5}
    .label{fill:#1a3b5d;font-family:Arial,Helvetica,sans-serif;font-size:39px;font-weight:600;text-anchor:middle}
    .number circle{stroke:#1a3b5d;stroke-width:2}
    .number text{fill:#1a3b5d;font-family:Arial,Helvetica,sans-serif;font-size:29px;font-weight:700;text-anchor:middle;dominant-baseline:central}
  </style>
