    .opening{stroke:#fff;stroke-width:36}
    .detail{fill:none;stroke:#58718a;stroke-width:3}
    .window{fill:#fff;stroke:#58718a;stroke-width:3}
    .label{fill:#1a3b5d;font-family:Arial,Helvetica,sans-serif;font-size:46px;font-weight:600;text-anchor:middle}
    .number circle{fill:#1a3b5d}
    .number text{fill:#fff;font-family:Arial,Helvetica,sans-serif;font-size:31px;font-weight:700;text-anchor:middle;dominant-baseline:central}
  </style>
