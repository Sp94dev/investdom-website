<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="800" viewBox="245 240 1260 800" role="img" aria-labelledby="title desc">
  <title id="title">Parter — schemat układu projektu</title>
  <desc id="desc">Przedsionek, hall, łazienka, salon z jadalnią, kuchnia, pokój i garaż. Numery odpowiadają legendzie. Układ odwzorowany ze skanu projektu; wymiary dostępne w oryginalnym rzucie.</desc>
